; runtime = prism/src/build/bin/llama-server
; NOT LOADABLE as is: Bonsai and the fork were deleted from compute 20261002; refetch and rebuild from pins first.
; The models llama-server's router mode may load (rung4b.md), one section per model; keys are llama-server's long
; options, and the section name is the model name callers ask for. The files are pinned in `pins`; install.sh
; fetches or checks all but the A3B and Bonsai. From 20260930 (the orchestrator's decision) only two models, both loaded at start and resident:
; local-chat (Hermes's model, named for the gateway route) and qwen3-embedding-4b. With exactly two models here and
; MODELS_MAX=2 (pins), the router's least-recently-used eviction doesn't happen: it loads a model only when asked
; (it also lists any in its download cache, empty here), and the gateway asks only for these two. The reranker and speech-to-text moved to the agent box
; (nixos/modules/aux-inference.nix); their sections here are kept in presets.retired.ini. The embedder keeps
; cache-ram = 0: without it the small models grew by ~0.5 GB per request (20260928). supervise.sh adds up the tree.

[local-chat]
; Ternary Bonsai 2 27B, PQ2_0 (PrismML: Qwen3.8-27B in ternary weights), on PrismML's llama.cpp fork (the runtime line
; above; pins BONSAI_*, PRISM_*). On trial 20261001 (item 12 stage 2; evidence/20260930-qwen-quality-bench.md):
; ~2.2x the 27B's generation, the same prompt reading, 18 GiB (evidence/20260930-qwen-speed-bench.md). The same flags as the 27B (presets.27b.ini says why);
; the RAM cache sized by a footprint check.
; presets.ini is a link to this file, presets.27b.ini or presets.a3b.ini: switching back is that one link, then a restart.
model = /Users/seed/.local/share/seed/inference/models/Ternary-Bonsai-2-27B-PQ2_0.gguf
ctx-size = 131072
parallel = 3
kv-unified = true
cache-type-k = f16
cache-type-v = f16
flash-attn = on
; RAM prompt cache 16 GiB (20261001, a fill test): Bonsai + the embedder is 21.2 GiB idle, and with the cache full
; 37.8 GiB, pressure normal, free never under 56 %. An entry costs as on the 27B (17.7k tokens: 1,554 MiB), so this
; holds ~10 of Hermes's prefixes: a fresh chat's 15.4k-token prefix came back from RAM in 2.5 s, against 139.5 s cold.
cache-ram = 16384
fit = off
jinja = true
; thinking capped at 2,048 tokens a call (20261001, the owner's approval: a test; 1,024 cut a diagnosis mid-plan; uncapped Bonsai wrote 2.6 to 3.3k
; tokens a call in Hermes's runs, up to 13k): llama-server ends the reasoning there and the answer follows
reasoning-budget = 2048
reasoning-budget-message = (Thinking budget reached: act on what you have.)
load-on-startup = true

[qwen3-embedding-4b]
; embeddings: last-token pooling (the model's own), inputs up to 4096 tokens, two at a time. Working peak
; with all four loaded and busy: 5,608 MiB for this process, 44,671 MiB for the tree (rung4b.md, Measured)
model = /Users/seed/.local/share/seed/inference/models/Qwen3-Embedding-4B-Q8_0.gguf
embeddings = true
pooling = last
ctx-size = 8192
parallel = 2
batch-size = 4096
ubatch-size = 4096
cache-ram = 0
load-on-startup = true
fit = off
