; Retired model presets: NOT read by the router (serve.sh passes only presets.ini). Kept as the record of rung 4b
; (rung4b.md and its benchmark results in bench/), exactly as they were served.
; glm-4.7-flash: retired 20260929 (the owner's decision), freeing its memory for a later Qwen model; the gateway's
; glm-4.7-flash-local, local-chat and local-code routes went with it (site/infra/litellm/config.yaml).

[glm-4.7-flash]
; chat and coding (README): two slots of 32k, the prompt cache off; loaded at start, never idle-unloaded
model = /Users/seed/.local/share/seed/inference/models/GLM-4.7-Flash-Q8_0.gguf
ctx-size = 65536
parallel = 2
cache-ram = 0
fit = off
jinja = true
load-on-startup = true
