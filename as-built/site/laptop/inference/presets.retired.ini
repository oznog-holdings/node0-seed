; Retired model presets: NOT read by the router (serve.sh passes only presets.ini). Kept as the record of rung 4b
; (rung4b.md and its benchmark results in bench/), exactly as they were served.
; glm-4.7-flash: retired 20260929 (the owner's decision), freeing its memory for a later Qwen model; the gateway's
; glm-4.7-flash-local, local-chat and local-code routes went with it (site/infra/litellm/config.yaml).

[glm-4.7-flash]
; chat and coding (README): two slots of 32k, the prompt cache off; loaded at start, never idle-unloaded
model = /Users/seed/.local/share/seed/inference/models/GLM-4.7-Flash-Q8_0.gguf
ctx-size = 65536
parallel = 2
cache-ram = 0
fit = off
jinja = true
load-on-startup = true

; 20260930: moved to the agent box (nixos/modules/aux-inference.nix, the same files and settings, on CPU and
; on demand) so compute keeps its memory for Qwen and its RAM prompt cache. Their compute sections, as they were:
[qwen3-reranker-0.6b]
; reranking: query and document together up to 2048 tokens, two at a time. The micro-batch sets the
; output buffer (logits over a 151k vocabulary per position): 4096 grew the process from 1.7 to 4.4 GiB
; on a 50-document request (20260928)
model = /Users/seed/.local/share/seed/inference/models/qwen3-reranker-0.6b-q8_0.gguf
reranking = true
ctx-size = 4096
parallel = 2
batch-size = 2048
ubatch-size = 2048
cache-ram = 0
fit = off

[qwen3-asr-1.7b]
; speech-to-text: /v1/audio/transcriptions becomes a chat completion with the audio (the projector)
model = /Users/seed/.local/share/seed/inference/models/Qwen3-ASR-1.7B-Q8_0.gguf
mmproj = /Users/seed/.local/share/seed/inference/models/mmproj-Qwen3-ASR-1.7B-Q8_0.gguf
ctx-size = 8192
parallel = 1
cache-ram = 0
fit = off
jinja = true
