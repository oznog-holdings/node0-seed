; The models llama-server's router mode may load (rung4b.md), one section per model; keys are llama-server's long
; options, and the section name is the model name callers ask for. The files are pinned in `pins`; install.sh
; fetches or checks all but the A3B. From 20260930 (the orchestrator's decision) only two models, both loaded at start and resident:
; local-chat (Hermes's model, named for the gateway route) and qwen3-embedding-4b. With exactly two models here and
; MODELS_MAX=2 (pins), the router's least-recently-used eviction doesn't happen: it loads a model only when asked
; (it also lists any in its download cache, empty here), and the gateway asks only for these two. The reranker and speech-to-text moved to the agent box
; (nixos/modules/aux-inference.nix); their sections here are kept in presets.retired.ini. The embedder keeps
; cache-ram = 0: without it the small models grew by ~0.5 GB per request (20260928). supervise.sh adds up the tree.

[local-chat]
; Qwen3.6-35B-A3B unsloth UD-Q6_K_XL (MTP build; its MTP head unused: MTP was slower on this M1 Max), the site agent's
; model from 20261001 on trial (item 12 stage 2; evidence/20260930-qwen-speed-bench.md, -quality-bench.md): a mixture
; of experts, 35.95B total, ~3B active per token; the same hybrid attention as the 27B. ~5x the 27B's speed here.
; presets.ini is a link to this file or to presets.27b.ini: switching back is that one link, then a restart.
; The same flags as the 27B but the RAM cache; why each (three slots on one unified KV): presets.27b.ini.
model = /Users/seed/.local/share/seed/inference/models/Qwen3.6-35B-A3B-UD-Q6_K_XL.gguf
ctx-size = 131072
parallel = 3
kv-unified = true
cache-type-k = f16
cache-type-v = f16
flash-attn = on
; RAM prompt cache 4 GiB (20261001): the A3B's footprint with the embedder is ~3 GiB under the 27B's, and a saved
; prompt costs less (Hermes's 17.8k-token prefix: 977 MiB, the 27B's 16k: 1,453), so 4 GiB holds about four sessions'
; prefixes at a footprint still under the 27B's with 2 GiB (evidence/20260930-qwen-quality-bench.md).
cache-ram = 4096
fit = off
jinja = true
load-on-startup = true

[qwen3-embedding-4b]
; embeddings: last-token pooling (the model's own), inputs up to 4096 tokens, two at a time. Working peak
; with all four loaded and busy: 5,608 MiB for this process, 44,671 MiB for the tree (rung4b.md, Measured)
model = /Users/seed/.local/share/seed/inference/models/Qwen3-Embedding-4B-Q8_0.gguf
embeddings = true
pooling = last
ctx-size = 8192
parallel = 2
batch-size = 4096
ubatch-size = 4096
cache-ram = 0
load-on-startup = true
fit = off
