; The models llama-server's router may load (rung4b.md), one section per model; keys are llama-server's long options,
; and the section name is the model name callers ask for. The files are pinned in `pins`.
; THE UTILITY TIER (20261002, the owner's plan): compute stops being an agent-model runner and holds the utility
; models plus one general text model. presets.ini is a link to this file (or to presets.27b.ini, the arrangement
; before: switching back is that one link, then a restart).
;   resident:  the embedder, the reranker, speech-to-text (and, beside the router, encoders.py: PII-Tracer, GLiNER,
;              the secret scanner)
;   general:   local-text, the A3B at 4 bit, loaded at start: summaries, transcripts, digests (not agent diagnosis)
;   on demand: local-chat, the 27B (Hermes's route, unchanged; careful overnight work), loaded when asked for
; Memory, not MODELS_MAX, is the limit: the supervisor unloads ON_DEMAND (local-chat, then local-text) as the tree
; nears the ceiling, before it would stop anything (supervise.sh). The A3B and the 27B don't both fit beside the
; resident set; whichever is idle goes. The memory budget: evidence/20261002-utility-tier-b/.

[local-text]
; Qwen3.6-35B-A3B, unsloth UD-Q4_K_XL (pins A3BQ4_*): the general text model, on trial (the 27B's comparison in the
; evidence). 64k tokens of context on two slots of one buffer; a small RAM cache (its saved prompts are cheap).
model = /Users/seed/.local/share/seed/inference/models/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
ctx-size = 65536
parallel = 2
kv-unified = true
cache-type-k = f16
cache-type-v = f16
flash-attn = on
cache-ram = 1024
fit = off
jinja = true
load-on-startup = true

[local-chat]
; Qwen3.8-27B Q8_0, on demand: careful overnight work. Sized to fit beside the resident set under the ceiling (measured
; 20261002: at 64k context, 3 slots and a 2 GiB RAM cache it took ~38 GiB, 53.5 GiB with the rest, and the supervisor
; had to unload it mid-job): one slot, 40k of context (the weekly digest is ~31k), no RAM cache. Too small for Hermes
; (its runs reach ~60k): Hermes's schedule is paused with the utility tier (the owner's plan: Hermes moves to a GPU).
model = /Users/seed/.local/share/seed/inference/models/Qwen3.8-27B-Q8_0.gguf
ctx-size = 40960
parallel = 1
cache-type-k = f16
cache-type-v = f16
flash-attn = on
cache-ram = 0
fit = off
jinja = true

