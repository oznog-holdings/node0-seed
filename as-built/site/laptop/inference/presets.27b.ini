; The models llama-server's router mode may load (rung4b.md), one section per model; keys are llama-server's long
; options, and the section name is the model name callers ask for. The files are pinned in `pins`; install.sh
; fetches or checks all but the A3B. From 20260930 (the orchestrator's decision) only two models, both loaded at start and resident:
; local-chat (Hermes's model, named for the gateway route) and qwen3-embedding-4b. With exactly two models here and
; MODELS_MAX=2 (pins), the router's least-recently-used eviction doesn't happen: it loads a model only when asked
; (it also lists any in its download cache, empty here), and the gateway asks only for these two. The reranker and speech-to-text moved to the agent box
; (nixos/modules/aux-inference.nix); their sections here are kept in presets.retired.ini. The embedder keeps
; cache-ram = 0: without it the small models grew by ~0.5 GB per request (20260928). supervise.sh adds up the tree.

[local-chat]
; Qwen3.8-27B Q8_0, the site agent's model until 20261001 (the gateway route local-chat asks for this section by name;
; presets.ini is a link to this file or another presets.*.ini: switching models is that one link, then a restart;
; presets.27b-budget.ini is this file with the thinking budget, for the 20261001 test)
; the site agent's model (Hermes; the owner's decision, 20260929), gateway route local-chat. Built from the official
; release (build-qwen38.sh; pins QWEN38_*). 131072 tokens of f16 KV cache (shared by the slots, below): the largest context that
; runs well here, measured (rung4b.md, Qwen3.8): at a full 128k context it generates 5.5 tokens/s with the embedding
; and reranker loaded beside it, no swap, pressure normal. A q8_0 cache would reach the native 262,144 in memory, but
; its generation falls to 2 tokens/s at 128k. Loaded at start, never idle-unloaded; the RAM prompt cache below.
model = /Users/seed/.local/share/seed/inference/models/Qwen3.8-27B-Q8_0.gguf
ctx-size = 131072
; two slots on ONE unified KV buffer of 131072 tokens (20260930): either slot may use all of it; the server gives
; each request the slot whose cached prefix matches best. So the 5-minute monitoring probe no longer evicts the
; site agent's cached prompt (Hermes's base prompt alone is ~15.4k tokens, 139 s cold). Same KV memory as one slot.
; three slots (20260930, the orchestrator's approval): with two, two Hermes sessions plus the probe evicted each
; other's cached prompts and single calls ran cold for 8-21 minutes. Now one for Hermes (one session at a time), one
; for the probes (they match their own slot), one spare (a second agent session, or a probe while Hermes starts).
parallel = 3
kv-unified = true
cache-type-k = f16
cache-type-v = f16
flash-attn = on
; RAM prompt cache: 2 GiB (20260930, the orchestrator's decision; 6 and 3 GiB didn't fit: pressure warn, the
; supervisor stopped Qwen). A saved prompt costs ~92 KiB a token (the server's own log: 16k tokens = 1,453 MiB), so
; 2 GiB holds Hermes's ~15.7k-token shared prefix and little more: the case that hurts (a fresh chat). supervise.sh
; counts it by footprint, compressed pages included (evidence/20260930-qwen-ram-cache.md).
cache-ram = 2048
fit = off
jinja = true
load-on-startup = true

[qwen3-embedding-4b]
; embeddings: last-token pooling (the model's own), inputs up to 4096 tokens, two at a time. Working peak
; with all four loaded and busy: 5,608 MiB for this process, 44,671 MiB for the tree (rung4b.md, Measured)
model = /Users/seed/.local/share/seed/inference/models/Qwen3-Embedding-4B-Q8_0.gguf
embeddings = true
pooling = last
ctx-size = 8192
parallel = 2
batch-size = 4096
ubatch-size = 4096
cache-ram = 0
load-on-startup = true
fit = off
