; The models llama-server's router mode may load (rung4b.md), one section per model. Every section sets
; cache-ram = 0: the server's prompt cache in RAM defaults to 8 GiB per model, and without it the small
; models grew by ~0.5 GB per request until the ceiling held the tree (20260928). The section name
; is the model name callers ask for; keys are llama-server's long options. The files are pinned in
; `pins` (MODEL_* and MODELS_4B) and fetched by install.sh. Sized so that all four fit the 48 GiB
; ceiling at once with room to spare (rung4b.md, rule 5); supervise.sh adds up the whole tree.
; 20260929: glm-4.7-flash retired (the owner's decision); its section is kept in presets.retired.ini. Three models
; remain, none loaded at start: each loads on its first request.

[qwen3-embedding-4b]
; embeddings: last-token pooling (the model's own), inputs up to 4096 tokens, two at a time. Working peak
; with all four loaded and busy: 5,608 MiB for this process, 44,671 MiB for the tree (rung4b.md, Measured)
model = /Users/seed/.local/share/seed/inference/models/Qwen3-Embedding-4B-Q8_0.gguf
embeddings = true
pooling = last
ctx-size = 8192
parallel = 2
batch-size = 4096
ubatch-size = 4096
cache-ram = 0
fit = off

[qwen3-reranker-0.6b]
; reranking: query and document together up to 2048 tokens, two at a time. The micro-batch sets the
; output buffer (logits over a 151k vocabulary per position): 4096 grew the process from 1.7 to 4.4 GiB
; on a 50-document request (20260928)
model = /Users/seed/.local/share/seed/inference/models/qwen3-reranker-0.6b-q8_0.gguf
reranking = true
ctx-size = 4096
parallel = 2
batch-size = 2048
ubatch-size = 2048
cache-ram = 0
fit = off

[qwen3-asr-1.7b]
; speech-to-text: /v1/audio/transcriptions becomes a chat completion with the audio (the projector)
model = /Users/seed/.local/share/seed/inference/models/Qwen3-ASR-1.7B-Q8_0.gguf
mmproj = /Users/seed/.local/share/seed/inference/models/mmproj-Qwen3-ASR-1.7B-Q8_0.gguf
ctx-size = 8192
parallel = 1
cache-ram = 0
fit = off
jinja = true
