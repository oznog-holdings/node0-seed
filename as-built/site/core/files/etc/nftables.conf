#!/usr/sbin/nft -f
# core's firewall: inbound denied by default (design › Secrets and access: "the NixOS
# firewall denying inbound by default"; core is Debian, so nftables says it here). Outbound
# is open. Every service core offers is listed, and each for the LAN only.
flush ruleset

table inet seed {
  chain input {
    type filter hook input priority filter; policy drop;
    iif lo accept
    ct state established,related accept
    ct state invalid drop
    meta l4proto icmp accept
    meta l4proto ipv6-icmp accept
    udp dport 546 ip6 saddr fe80::/10 accept                      # DHCPv6 replies (the router's RA/DHCPv6)

    ip saddr 192.168.1.0/24 tcp dport 22 accept                   # ssh
    ip saddr 192.168.1.0/24 meta l4proto { tcp, udp } th dport 53 accept   # DNS primary: Technitium ns1 .15 (zone transfers to ns2 .16); AdGuard on .12 retired 20260929
    ip saddr { 192.168.1.1, 192.168.1.11 } ip daddr 192.168.1.15 tcp dport 5380 accept   # Technitium's API: the router's lease updates, the agent box's push
    ip saddr 192.168.1.0/24 udp dport 123 accept                  # NTP primary (chrony)
    ip saddr 192.168.1.0/24 tcp dport 443 accept                  # ntfy (notifications)
    ip saddr 192.168.1.10 tcp dport 9100 accept                   # node_exporter, for infra's Prometheus only

  }
  chain forward {
    type filter hook forward priority filter; policy drop;
  }
}
