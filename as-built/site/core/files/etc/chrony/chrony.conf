# core's chrony: the site's NTP primary from rung 3 (index › Rung 3; design › Time). infra's
# chrony container is the second server. Clients name core with `prefer`, then infra, then
# the public pool.
# the pool is preferred: while the internet is up core takes its time from outside; infra is
# core's source only when the pool is out of reach
pool 2.pool.ntp.org iburst maxsources 4 prefer
# infra, the second server, as a source too: it has a real-time clock and core (a Pi 4) has
# none, so after a cold start during an internet outage core takes infra's time, not its own
# guess (finding F-PI-RTC). A hierarchy (orchestrator's decision 20260924, the owner may overrule;
# F-NTP-LOOP): infra does NOT list core, so the two can't time each other in a loop.
server 192.168.1.10 iburst
driftfile /var/lib/chrony/chrony.drift
makestep 1 3
leapseclist /usr/share/zoneinfo/leap-seconds.list
# Serve the LAN, and keep serving through a long internet outage (design › Time:
# `local stratum 10`). `activate 0.1`: the local clock is offered only after core has once
# been properly synchronised since it started, so a Pi that booted with no clock and no
# upstream never hands its guess to the LAN.
allow 192.168.1.0/24
local stratum 10 orphan activate 0.1
# chronyc only from core itself
bindcmdaddress 127.0.0.1
cmdallow 127.0.0.1
