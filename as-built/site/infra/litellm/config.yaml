# The model gateway (index › Rung 1 › Do 3; Why › model gateway; design › Services › LLM gateway).
# One address for every model, spend metered per key. Every backend is an entry in this
# list: adding one is a diff that touches no existing entry (principle 8, X.06).
# Provider API keys are not here: they go into the vault and reach the gateway as
# environment variables (os.environ/...). Keys for people and agents are virtual keys
# created through the gateway's API, one per person or agent, each in the vault.

model_list:
  # Test backend: answers without calling any provider, with a stated price, so metering
  # per key can be proven before any provider account exists. Keep: it is the gateway's
  # own smoke test (seed-metrics.sh section 8 calls it every 5 minutes with the monitoring-probe key).
  - model_name: seed-selftest
    litellm_params:
      model: openai/seed-selftest
      mock_response: "ok"
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000002

  # Hosted backends: disabled, not deleted (design › Deploying). Condition to enable: the
  # provider API key exists in the vault ("<provider> api key") and the owner approves the
  # spend. Then uncomment and add the key to litellm.env.
  # - model_name: claude-opus-5-5
  #   litellm_params:
  #     model: anthropic/claude-opus-5-5
  #     api_key: os.environ/ANTHROPIC_API_KEY
  # - model_name: claude-sonnet-5
  #   litellm_params:
  #     model: anthropic/claude-sonnet-5
  #     api_key: os.environ/ANTHROPIC_API_KEY

  # Hosted, z.ai: the owner's GLM Coding Plan key (20260927, the owner's decision: configuration,
  # testing and proof; F-ZAI-CODING-PLAN records that the plan's terms list coding tools, not a
  # gateway). External and a subscription: coding traffic only. Only keys that name this model may
  # use it (today the agent box's `agent` key); nothing scheduled holds it (the monitoring probe
  # doesn't). Limits: at most 2 in flight here (max_parallel_requests); 60 requests an hour on the
  # key (model_rpm_limit with LITELLM_RATE_LIMIT_WINDOW_SIZE=3600, rendered into litellm.env). When
  # z.ai refuses or the limit is reached, the request fails (its local fallback was retired 20260929).
  - model_name: glm-5.3-coding
    litellm_params:
      model: openai/glm-5.3
      api_base: https://api.z.ai/api/coding/paas/v4
      api_key: os.environ/ZAI_API_KEY
      max_parallel_requests: 2
      timeout: 300
      input_cost_per_token: 0         # a subscription: no per-token cost; the plan's quota instead
      output_cost_per_token: 0
    model_info:
      tags: [external, subscription]
      traffic: coding

  # Local backends (rung 4, 4b): compute's llama.cpp router (site/laptop/inference/rung4b.md); the Mac answers only
  # this key (vault "compute llama api key"). Cost 0: local tokens are still counted per key.
  # 20260929 (the owner's decision): the chat model glm-4.7-flash is retired on compute, and with it the routes
  # glm-4.7-flash-local, local-chat and local-code (they are not pointed anywhere else, so nothing silently goes
  # hosted; a later local model takes the names). Its presets and benchmarks stay as the rung 4b record.
  # The remaining routes fail closed: no fallback, and no hosted deployment shares their names.
  - model_name: local-chat          # the site agent's model (Hermes). Fails closed: a site agent's context holds the site's
    litellm_params:                 # own data, so no hosted fallback, ever. The Mac's preset of the same name says which
      model: openai/local-chat      # model (site/laptop/inference/presets.ini: Qwen3.8-27B from 20260929, the A3B on trial)
      api_base: http://compute.seed.example.com:8080/v1
      api_key: os.environ/COMPUTE_LLAMA_API_KEY
      timeout: 3600                 # a full context's prompt takes most of an hour on this Mac (rung4b.md, Qwen3.8)
      input_cost_per_token: 0
      output_cost_per_token: 0
  - model_name: local-text          # the general text model (the utility tier, 20261002): summaries, transcripts, digests,
    litellm_params:                 # not agent diagnosis. The A3B at 4 bit on compute. Fails closed (site data)
      model: openai/local-text
      api_base: http://compute.seed.example.com:8080/v1
      api_key: os.environ/COMPUTE_LLAMA_API_KEY
      timeout: 1800
      input_cost_per_token: 0
      output_cost_per_token: 0
  - model_name: local-embed         # embeddings: fails closed (another model's vectors don't compare)
    litellm_params:
      model: openai/qwen3-embedding-4b
      api_base: http://compute.seed.example.com:8080/v1
      api_key: os.environ/COMPUTE_LLAMA_API_KEY
      timeout: 300
      input_cost_per_token: 0
    model_info:
      mode: embedding
  - model_name: local-rerank        # reranking: fails closed; llama.cpp's /v1/rerank speaks the vLLM/Jina API
    litellm_params:
      model: hosted_vllm/qwen3-reranker-0.6b
      # back on compute from 20261002 (the utility tier; on the agent box's CPU 20260930-20261002)
      api_base: http://compute.seed.example.com:8080/v1
      api_key: os.environ/COMPUTE_LLAMA_API_KEY
      timeout: 300
    model_info:
      mode: rerank
  - model_name: local-stt           # speech-to-text: fails closed, always (private audio; the owner's rule)
    litellm_params:
      # From 20261002 through compute's encoder service (encoders.py), which forwards to the router's speech model and
      # strips its "language X<asr_text>" prefix: a plain {"text"} answer, so the openai/ parser takes it.
      model: openai/qwen3-asr-1.7b
      api_base: http://compute.seed.example.com:8082/v1
      api_key: os.environ/COMPUTE_LLAMA_API_KEY
      timeout: 600
    model_info:
      mode: audio_transcription

router_settings:
  # No fallbacks since 20260929: glm-5.3-coding fell back to glm-4.7-flash-local, and local-code to glm-5.3-coding;
  # both local ends were retired with glm-4.7-flash. z.ai refusing now fails the request.
  fallbacks: []
  num_retries: 0

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # the encoder service on compute (site/laptop/inference/encoders.py; the utility tier, 20261002): not OpenAI routes,
  # so pass-through paths, each needing a gateway key (auth: true); the caller's key isn't forwarded, the Mac's is set
  pass_through_endpoints:
    - path: /utility/secrets                # gitleaks: secrets in a text, redacted
      target: http://compute.seed.example.com:8082/v1/secrets
      headers: {Authorization: "Bearer os.environ/COMPUTE_LLAMA_API_KEY"}
      auth: true
      methods: [POST]
      timeout: 120
    - path: /utility/pii                # PII-Tracer: personal data spans, a masked copy
      target: http://compute.seed.example.com:8082/v1/pii
      headers: {Authorization: "Bearer os.environ/COMPUTE_LLAMA_API_KEY"}
      auth: true
      methods: [POST]
      timeout: 120
    - path: /utility/injection                # prompt-injection screening: Qwen3Guard-Gen-0.6B and protectai's deberta v2
      target: http://compute.seed.example.com:8082/v1/injection
      headers: {Authorization: "Bearer os.environ/COMPUTE_LLAMA_API_KEY"}
      auth: true
      methods: [POST]
      timeout: 120
    - path: /utility/promptguard                # Prompt Guard 2: injection score (501 until installed)
      target: http://compute.seed.example.com:8082/v1/promptguard
      headers: {Authorization: "Bearer os.environ/COMPUTE_LLAMA_API_KEY"}
      auth: true
      methods: [POST]
      timeout: 120
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false          # the backend list lives in this file, not in the UI (rung 4: "written in the repo")
  disable_spend_logs: false

litellm_settings:
  drop_params: true
  telemetry: false
  # no prompt or response content in logs: spend and counts only (design › Monitoring: no personal data)
  turn_off_message_logging: true
