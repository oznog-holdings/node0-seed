rule_files: [replica.yml]
evaluation_interval: 1m
tests:
  # a replica 1 h old is quiet; one that stops at t=0 fires 10 min after it passes 2 h
  - interval: 5m
    input_series:
      - series: 'seed_replica_newest_snapshot_timestamp_seconds{dataset="documents"}'
        values: '-3600+0x40'
      - series: 'seed_replica_key_loaded'
        values: '1x10 0x10'
      - series: 'seed_job_last_success_timestamp_seconds{task="replica-snap"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: ReplicaStale
        exp_alerts: []
      - eval_time: 75m
        alertname: ReplicaStale
        exp_alerts:
          - exp_labels: { severity: warning, dataset: documents }
            exp_annotations: { summary: "site2's replica of documents is 2h 15m 0s old (over 2 h): check syncoid on site2 and replica-snap on infra." }
      - eval_time: 40m
        alertname: ReplicaKeyNotLoaded
        exp_alerts: []
      - eval_time: 75m
        alertname: ReplicaKeyNotLoaded
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations: { summary: "site2/seed's key isn't loaded on site2: nothing can be received (site2-pool.service, /run/secrets/zfs_key)." }
      - eval_time: 110m
        alertname: ReplicaSnapshotsStale
        exp_alerts: []
      - eval_time: 125m
        alertname: ReplicaSnapshotsStale
        exp_alerts:
          - exp_labels: { severity: warning, task: replica-snap }
            exp_annotations: { summary: "infra's hourly replica snapshots last succeeded 2h 5m 0s ago (replica-snap, User Scripts)." }
