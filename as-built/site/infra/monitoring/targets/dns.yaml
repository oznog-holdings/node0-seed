# DNS servers that must answer the site's names (module dns_site asks for infra.seed.example.com).
# From rung 5 › F (20260929): Technitium only; AdGuard on core (.12) and infra (.10) retired.
# ns1 is core's second address. ns2 (192.168.1.16, a container on Docker's br0, macvlan) is reachable from infra
# since Docker's host access to custom networks (the shim, 20260929); before that only the watcher could probe it.
- targets: ["192.168.1.15", "192.168.1.16"]
  labels: { server: ns1, host: core }
