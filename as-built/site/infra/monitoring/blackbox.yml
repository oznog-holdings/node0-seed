# blackbox exporter modules (design › Monitoring).
modules:
  # plain HTTP on the LAN (rung 4: compute's model backend answers /health without TLS or a key)
  http_2xx_lan:
    prober: http
    timeout: 10s
    http:
      valid_status_codes: []        # 2xx
      preferred_ip_protocol: ip4
  http_2xx:
    prober: http
    timeout: 10s
    http:
      valid_status_codes: []        # 2xx
      fail_if_not_ssl: true
      preferred_ip_protocol: ip4
  # a TCP connect (rung 6: the firewall's web port; no raw sockets needed, unlike ICMP)
  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
  dns_site:
    prober: dns
    timeout: 5s
    dns:
      query_name: infra.seed.example.com
      query_type: A
      valid_rcodes: [NOERROR]
      validate_answer_rrs:
        fail_if_none_matches_regexp: [".*\t192\\.168\\.1\\.10$"]
      preferred_ip_protocol: ip4
