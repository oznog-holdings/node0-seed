# infra's chrony (design › Time). From rung 3 the site's second NTP server: core is the
# primary and clients name it first (index › Rung 3). Runs on the host network with
# CAP_SYS_TIME, so it also keeps infra's own clock (Unraid's ntpd is off in Settings › Date
# and Time).
# A hierarchy, not a pair (orchestrator's decision 20260924, the owner may overrule; F-NTP-LOOP):
# infra takes its time from the public pool only, never from core. core takes the pool (prefer)
# and infra. When both lost the internet with each listing the other, they timed each other in a
# loop (stratum 5 from 4 from 5) and never reached `local stratum 10`.
pool 2.pool.ntp.org iburst maxsources 4
driftfile /var/lib/chrony/chrony.drift
makestep 1 3
rtcsync
# Serve the LAN, and keep serving through an internet outage (R1.30): with the pool out of reach
# infra falls back to its own clock (it has a real-time clock), and core follows infra.
allow 192.168.1.0/24
local stratum 10 orphan
# chronyc only from infra itself
bindcmdaddress 127.0.0.1
cmdallow 127.0.0.1
